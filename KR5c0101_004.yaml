front:
  text: 道德經論兵要義述卷之四器八
  hash: sha256:d3be8255be8ebaf1124fca5947f0468377d751d1149788e84a7c49f9abe201b7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0101_HFL_004-001a, image: hfl/0417/0417-098.png}
body:
  text: 朝議郎使持節漢州諸軍事守漢州刺史充威勝軍使賜緋魚袋臣王真上治大國章第六十臣真述曰治天下國家之人皆似烹煮小魚也當以安靜不撓為本既以安靜為本自然不失其道道既不失陰陽大和陰陽大和則風雨時若風雨時若則百靈獲安百靈既安則妖精之徒不能為變怪之事故曰其鬼不神且明王在上兵革不興信順之人天地福祐是以聖神協應盛德交歸焉不亦宜乎大國者下流章第六十一臣真述曰此章極言王者常以謙下為德也豈以兵革强力而求勝負於其間哉夫大國小國之交人事兼畜之義考其情理豈非各務其所欲耶夫各求其所欲必則大者宜為下明矣凡謙卑之道皆損上益下其用在上不在下也故易曰以貴下賤大得民也其是之謂乎道者萬物章第六十二臣真述曰聖人所以寶此道者以其可保保養天下之人也夫天下之人善者少不善者多其可盡棄之耶是以聖人立天下置三公務戢干戈不用刑罰美其言尊其行冀其遷善理而化之故為天下貴何拱璧駟馬而欲較其優劣哉為無為章第六十三臣真述曰至道之君端拱垂衣而治故曰為無為也偃武不爭故曰事無事也含道存神故曰味無味也夫萬國之心兆人之性冬寒夏雨尚有咨嗟王者之心豈限大小寧論多少皆當以德綏之俾無怨咎故曰報怨以德夫天下難事必作於易者言人君若有所慢易則必有禍難之事生於其間也天下大事必作於細者言人君不矜細行終纍大德也是以聖人防微以至於著積小以成其大若於已著已大而後為之則不及已故曰終不為大乃能成其大若故輕諾必寡信多易必多難理固然矣又簡易之道則易從也慢易之失則難生也是以聖人猶難之者重慎之至然後能於萬事萬機竟無所難故曰終無難其安易持章第六十四臣真述曰此章全言成敗在人始終有道聖人以此不敢妄動以求速成者也是以居安思危故曰易持也先天不違故曰易謀也忽有奸宄作難必當乘其危脆之初破之必易接其細微之始散之無難故曰為之於未有理之於未亂此皆以先見先覺未萌未兆之前欲早為之恐其滋蔓即難圖也又大樹生於纖毫高臺超於覆簣遠行發於自邇此三者皆明積小以至於大由近以及其遠若循涯而俟之則必至之期也若過分而求之則欲速之纍也故師旅之事不可為為者必當自敗也干戈之器不可執執者必當自失也是以聖人無所為無所執故無以敗無以失明矣又世間之人皆從事多疑臨途好徑行師守國多於垂成而自敗之此皆是失其本末迷於始終者也故曰慎終如始則無敗事是以聖人欲人之所不欲故曰不貴難得之貨學人之所不學故曰復衆人之所過蓋欲輔助萬物使自然而成熟之終亦不敢專擅獨見有所云為者也故曰以輔萬物之自然而不敢為也古之善為道章第六十五臣真述曰此言古者之善為道之君不教天下之人使有智者以其詐所藏也將以天下之人愚之者以其直所在也故曰人之難治以其智多又曰以智治國國之賊何者凡衆庶之徒恆性淺劣智慮未發狙詐先行怨讟豈辨於是非逆順寧知其撫虐或蟻聚於州黨或蜂起於河山一凶首謀萬人隨唱征伐之舉恆必由之此亦非謂其用智治國即為國之賊也言其使衆庶之徒多智即盡能為國之賊害也故欲使天下之人皆能守其愚直朴素者乃所以為國之福祿也若國君常能知此兩者即自為楷模法式是謂與天同德也夫其玄德深矣遠矣欲令人君則之象之自然與萬物反其朴素則天下之人必能至於大順故曰然後乃至大順江海所以能為百谷王章第六十六臣真述曰此特引江海之為喻者蓋欲其人君謙柔卑巽之極也夫謙柔卑巽之極乃得天下之歡心得天下之歡心然後得樂推而不厭得樂推而不厭則自然上下無爭夫不爭之義與天同德美利萬物不言善應周流六虛不謀善勝且天下之人孰能與不爭者爭乎哉必不然矣天下皆謂我大章第六十七臣真述曰此章欲明三寶之要先舉我大之文夫大者道之體也下士不知故謂似不肖此欲其人君深詳三寶之義保而持之故先開用捨之端以明慈儉之德也夫言慈故能勇者謂以一人之慈心而得天下之死力非能勇而何夫言儉故能廣者謂以一人之儉嗇而得天下之富有非能廣而何是以三皇用之以尅九黎五帝用之而去四凶湯武用之而以兵勝天下成康文景用之而刑罰皆措及其桀紂捨之而國滅幽厲捨之而身亡秦嬴捨之而二代夷戮項籍捨之而五體割分漢武捨之而天下减半曹公捨之而吳蜀鼎峙故曰捨其慈且勇捨其儉且廣夫言捨其慈者謂去其慈愛於人人無死力之報乃以一人之膽烈欲敵天下之仇讎安可施其勇敢哉夫言捨其儉者謂不知愛嗇厚其聚斂奢其宫室加其師旅財穀皆空君孰與足又經曰後其身而身先又云欲先人必以身後之是以聖人常不敢為天下先而終為天下先矣故自黃帝至于文景用之之效也如彼自桀紂至于曹公捨之之驗也如此故曰夫慈以戰則勝以守則固天將救之以慈衛之善為士者不武章第六十八臣真述曰夫體道之君皆處無為之事行不言之教奚武之所尚哉又善戰者不敗必以恬淡為上既曰勝而不美猶以悲哀喪禮而處之何怒之有哉又聖君德合天地自然無爭故曰善勝敵者不爭夫王者節用而愛人使民以時故用輔弼之臣則比之股肱心膂用將帥之臣則跪而受鉞行而推轂此必先得其心後用其力者也故曰善用人者為之下是謂不爭之德不爭之德可以配天立極故曰古之極也用兵有言章第六十九臣真述曰道君謙讓不能自言故假用兵者有言也夫兵者必以先舉者為主後應者為客也且聖人之兵常為不得已而用之故應敵而後超應敵而後起者所以常為客也進少退多者是沉機密用重敵之意也故雖有敵至我則善師而不陳善師而不陳即自無征伐矣故曰行無行也既無征行即我之師徒抱義以守何攘臂之有哉夫有道之君縱有凶暴之寇妄動而來我師告之以文詞舞之以干羽彼必聞義而退自然無敵故曰仍無敵敵既退却干戈戢藏故曰執無兵兵既戢藏恐其忘戰故又戒之曰禍莫大於輕敵輕敵幾喪吾寶輕敵者謂好戰於外無備於內與其無備於內寧好戰於外好戰於外猶有勝負無備於內必至滅亡夫聖人在上誠無敵於天下然以其時主理亂言之則敵亦衆矣何者書云撫我則后虐我則讎若然者即天下皆吾敵也一國亦吾敵也一鄉亦吾敵也一家亦吾敵也一身亦吾敵也故王者不遺卑小之臣即得萬國之歡心矣公侯不侮於鰥寡即得百姓之歡心矣卿大夫不失其臣妾即得小大之歡心矣士庶人不忘於修身即得真實之歡心矣夫然乃可以全吾所寶矣吾寶者身與位也故曰抗兵相加哀者勝矣凡言哀者慈愛發於哀誠之謂也若上存慈愛之心不失使臣之禮下輸忠勇之節盡得事君之義即何向而不勝哉故曰哀者勝矣吾言甚易知章第七十臣真述曰天下之利害莫大於用兵是以道君殷勤懇惻於此前章已極言用兵重敵之義矣猶恐後之人不能曉達故於此章又特云吾言甚易知甚易行又曰言有宗事有君宗者根本之謂君者主守之謂此謂吾之云言皆有宗本吾之叙事皆有主守而人但不能知不能行爾故歎曰知我者希則我者貴則法也貴亦猶希也今既不能見知於我又不能法則於我即是道德不行道德不行是以聖人見暗於外藏明於內處而不出之義也故曰被褐懷玉知不知上章第七十一臣真述曰夫有知其所知而不言其所知此人之上也蓋有不知其所知而强言其所知者是人之病也故知此妄知為病則不病也至於用兵之機尤在於此唯聖與賢乃能知之也民不畏威章第七十二臣真述曰大威者甲兵之謂也凡士庶人無所畏則刑罰至卿大夫無所畏則黜辱至侯王無所畏則甲兵至又書云不畏入畏同此義也又戒其為人上者當以寬大居心無令狹隘為體又不得自鄙薄其生之理夫不自鄙薄必重於治人重於治人人必樂推人既樂推又誰厭乎故先為不可厭之事然後得人不厭故曰夫唯不厭是以不厭夫聖人之明固已自知安肯揚己露才以自呈見聖人之仁固當自愛安肯驕人傲物以為尊貴是以去彼自見自貴之大迷取此自知自愛之弘益故曰去彼取此勇於敢則殺章第七十三臣真述曰此章言人君若果敢而為勇猛者必好兵强於天下而殘殺其人也若果敢而不為勇猛者必務道行於域中而全活其人也故曰知此兩者有利有害夫天之所惡者好殺之人也聖人知之久矣今又言猶難之者蓋重戒之極也夫聖人則天行道無為而立事不言而設教在天下豈有爭之者乎既無所爭則何從而不勝故曰不爭而善勝夫天從人欲疾於影響非善應歟寒則夏至熱則冬至非自來歟品物流形各正性命非善謀歟恢恢之網人君象法也宥過無大非疏而何刑故無小非不失而何又書曰天作孽猶可違自作孽不可逭亦同此義也人不畏死章第七十四臣真述曰夫窮兵黷武峻制嚴刑則人必無聊也人既無聊則不得畏其死明矣既不畏死如何更以罪罪之民免而無耻其在兹乎若人君以道德化之則人必懷生而畏死自然有耻且格既有耻且格而復有凶惡之徒忽為奇者即吾得執而殺之此謂用兵之徒作奇巧詐僞而亂人惑衆者也則吾得執持而誅殺之然以其是天之所惡猶不得自專故曰孰敢常有司殺者司殺者謂天網也且王者萬方有罪當自責躬以俟天神自行誅殛也豈可寄情遷怒濫罰無辜故曰代大匠斫希有不傷其手者矣人之饑章第七十五臣真述曰此章言人君役繁賦厚稅重入多由此凶饑理固然矣又言有為者是人君好為兵革之事夫一家有兵以及一鄉一鄉有兵以及一國一國有兵以及天下天下有兵亂靡有定於是耕夫釋耒而執干戈工女投機而休織紝齊人編户太半從戎子弟父兄鄰里宗黨同為鋒俠共作奸回雖善誘恂恂孰云孔易故曰難治夫人之輕死者為君上營求之過厚使下之人無聊是以輕死故歎曰夫唯無以生為者是賢於貴生賢猶善也此謂好積財以貴其生者也非保道以養其生者也民之生章第七十六臣真述曰此章又極言柔弱之用指陳生死之徒臣愚竊稽其深意都在於兵强則不勝之義又下文云木强則拱强大處下柔弱處上者蓋又切戒其兵强之患也何者夫兵者所謂凶險之器鬬爭之具所觸之境與敵對者也故兵强則主不憂主不憂則將驕將驕則卒暴夫以不憂之君御驕將以驕將臨暴卒且敗覆之不暇何勝敵之有哉故夏商之衰以百萬之師而傾四海始皇之末以一統之業而喪九州項羽忽霸而遽亡新莽既篡而旋滅苻堅狼狽於淮上隋煬分崩於楚宫此數家之兵皆多至數兆少猶數億無不自恃其成以取其敗此皆强則不勝之明驗也又兵者求勝非難持勝其難唯有道之君然後能持勝向數君之敗皆由不能持勝之過也豈不信哉天之道章第七十七臣真述曰此一章所引張弓之喻者正在於損益之道爾言侯王若能知此損益利害之要則天下將自均平矣易曰何以聚人曰財理財正辭禁人為非曰義且成財者耕織之人也破財者軍旅之人也夫成者寡而破者衆此其所以長損不足而奉有餘也若使化兵為農損上益下則自然無偏無黨平施大同故曰孰能以有餘奉天下唯有道者此言理財正辭以佐佑人之義也又聖人雖能變化兩儀而不恃其力雖能生成萬物不處其功蓋欲陰德潜行不言所利故曰不欲見賢見賢謂揚己伐善也天下柔弱章第七十八臣真述曰此一章又特引水柔弱能攻堅强者也嘗試論之曰且夫五行之用土能制水原其至極土在水中鑽石流金無所不剋萬川朝海四海宗天孰云剛强而有勝此故曰其無以易之是以道君深嘆天下之人不能知此之妙用勤而行之故曰莫能知莫能行復引聖人之言受國之垢與其不祥此所謂百姓有過在余一人萬方有罪罪在朕躬王者之心誠兼此義言之有似反倒故曰正言若反和大怨章第七十九臣真述曰夫天生蒸人而大欲各存於心爭勝逐利背正為邪大者相讎小者相怨天既愍之樹君以理令其革弊乃有餘弊生焉豈得為善也故曰安可以為善是以聖人持德信之心行不言之教加恩於九有恕罪於萬方夫契者德信之謂又吉事尚左無問智愚皆同赤子故曰執左契而不責於人也若人君不以道化天下但齊之以刑導之以政即不得盡善之道故曰無德司徹徹者有迹之謂也言守其禮法之徹迹耳又言人君若長能體道理國者則天地靈祇必常隆其景祚也故曰天道無親常與善人小國寡民章第八十臣真述曰此章言為君之道雖處大國之强亦常須自為卑小雖有衆庶之力亦常須自示寡弱夫自為卑小者且無矜大之過不失謙柔之道自示寡弱者且無恃賴之尤不失隄防之備設使國中有什人之豪百人之長者亦不任用以生其必夫如是則人各懷戀其生畏重其死既安鄉土寧遠遷移又饋餉不行則舟車無所用戰爭既息則兵甲無所陳自然人致太平以復結繩之政由是甘其食美其服止足存於衷也安其居樂其俗風化行於時也自然鄰國對境無相覬覦詐僞不行忠信為寶不相姑息俱無聘問之私不懷隱欺自絶往來之禮故曰民至老死不相往來也信言不美章第八十一臣真述曰此一章道君自以為親著五千之文將傳億萬之代明彰日月德合乾坤弘大道先天而生表聖人法地而理定德仁之優劣論禮義之重輕去彼薄華居斯厚實是以重標三節將明兩端此蓋同出而異塗言行之深戒者也夫誠信者不務諂諛不矜捷給無甘巧之說絶詭飾之詞安得而美哉夫善德善言天之道也聖人奉而行之豈容辨僞生乎其間又曰聖人不積者此言聖人非無積也但以其財積而能散之德積則能行之故下文又言天之道利而不害者終欲重明聖人象天地之大德以佐佑生生之理故又曰聖人之道為而不爭夫聖人所以貴之者無為也今此乃言為而不爭何也臣以為此之一章乃是八十篇之末章此之一句又是五千文之末句故知言之宗事之君其義盡在此矣此蓋不言有為與無為而直言為者欲其人君為無為也又欲其無不為也其義明矣夫一家不爭即鬭訟息矣一國不爭即戰陳息矣天下不爭則征伐息矣夫鬭訟息於家戰陳息於國征伐息於天下此聖人之理也故曰聖人之道為而不爭其此之謂歟道德經論兵要義迷卷之四
