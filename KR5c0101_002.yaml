front:
  text: 道德經論兵要義述卷之二器六
  hash: sha256:d2c62b8f67c335c52806bf7fe92657186976230d7594f0e047f559c87b7c3f12
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0101_HFL_002-001a, image: hfl/0417/0417-044.png}
body:
  text: 朝議郎使持節漢州諸軍事守漢州刺史充威勝軍使賜緋魚袋臣王真上大道廢章第十八臣真述曰大道既隱下德有為仁義之行遂從此始巧智小慧大僞生焉孝慈出於不和忠臣生於昏亂兹亦美惡相形之謂也絶聖棄智章第十九臣真述曰此言絶有迹之聖棄矜詐之智則人受大利矣故曰百倍又仁生於不仁義生於不義今欲令絶矯妄之仁棄詭譎之義俾親戚自然和同則孝慈復矣又絶淫巧棄私利則兵革不興兵革不興則盜賊不作矣然猶恐後代不曉正言若反之意故又曰此三者以為文不足故令有所屬見素抱朴少思寡欲夫見素者外其質野之容抱朴者內其真實之意又思慮嗜欲者人之大性存焉可節也不可絶也故勸王侯令少之寡之則國延其祚人受其賜也絶學無憂章第二十臣真述曰絶日益之學則無憂矣唯之與阿善之與惡相去甚近又戒其人曰何故不恭而好慢邪去善而為惡邪豈不甚惑哉故曰人之所畏不可不畏今衆人熙熙然大荒乎嗜欲常如對享太牢之饌共登陽春之臺縱放其情無央極哉是以道君曰我獨怕然靜默若嬰兒之未有所知有如乘其車乘悠悠未有所止此蓋示人以謙卑退讓之貌不學衆人矜誇炫耀自言智慧有餘也故下文又曰而我獨若遺我愚人之心也哉言我豈若愚人之心哉言非也我但昏昏悶悶忽忘若晦寂而無所止獨頑似鄙獨異於人而貴食母夫食者服也母者道也蓋欲勸君服道於身以處無為之事則兵革自戢天下獲安矣孔德之容章第二十一臣真述曰孔甚也言甚大德之形容謂天地也天地因道而生承道而化故曰唯道是從道之為物惟恍惟惚惚兮恍兮其中有象言太初之氣從無入有之象恍兮惚兮其中有物言太始之氣因有成形之謂窈兮冥兮其中有精言男女媾精萬物化生雖在窈冥之中常不失其信故曰自古及今其名不去又言萬物始生皆自於恍惚窈冥之中故曰吾何以知衆甫之然哉以此曲則全章第二十二臣真述曰此章所言曲者謂柔順屈曲之義也非謂回邪委曲之徒也自此以下皆正言若反之意是以聖人抱一者唯抱此曲全之道以為天下之法式也又從不自見以下四節皆不爭之道也故曰夫唯不爭故天下莫能與之爭天下莫能與之爭則兵戰自然息矣故曰古之所謂曲則全者豈虛言哉誠以此曲全之道而歸根于正靜者也治軍治國之道先此為妙也希言自然章第二十三臣真述曰希言者無為無事之謂但使為上者希其言省其事即合於自然之道也又理國理戎皆忌於繁促猛暴之政故舉飄風驟雨之喻以明之夫同道同德之順也同於失者失亦得之以其迷日固久同失之人各自得之亦俱不知是失故曰失亦得之也信不足者此言下信不足亦由上之人不信也跂者不立章第二十四臣真述曰凡踶跂闊步之人皆不得正立而安行者也此論躁競之徒舉兵動衆皆不得中正之道也而况自見其明自是其彰自伐其功自矜其長故聖人舉此餘穢之食贅醜之行總皆惡之則有道者安得而處之哉有物混成章第二十五臣真述曰此一章極言道體無狀之狀無象之象無名之名無物之物故曰强為之名曰大凡言大者無窮無際之謂也且群方廣大道無不之之猶逝也逝而不已必遠遠而至極必還故曰返也此言道之周行無所不在故為天下之母母者道之宗宗者一也故經曰王侯得一以為天下貞此所謂能以衆正可以王矣是以三才相法以至於道道乃法其自然故王者法其自然則能事畢矣重為輕根章第二十六臣真述曰君子不重則不威又靜者仁之性也古之所謂君子者通言天子與諸侯也終日行者言君子假如終竟一朝一日之行亦必須崇備法駕居其輜重之中以謹其不虞也輜重者兵車營衛之具也又言人君雖有離宫别館超然高邈豈可以萬乘之重自輕於天下此又深戒其單車匹馬潜服微行之失是以輕舉則失於為君使臣之禮躁動則失於為臣事君之義豈可不畏哉故曰輕則失臣躁則失君其是之謂乎善行無轍迹章第二十七臣真述曰無轍迹者行無行也無瑕謫者守中也不用籌策者戰必勝也不可開者守必固也不可解者無端緒也此五善者皆聖人密謀潜運不露其才不揚其已不顯其迹不呈其形常欲令戢兵於未動之際息戰於不爭之前是以國無棄人人無棄物此皆襲用明聖之妙道以至是乎又聖人不立德於人不衒仁於物但使百姓日用而不知故亦不尚師資之義然恐衆人不寤至理以為大迷深論奧㫖誠為要妙也知其雄章第二十八臣真述曰夫為人君者己有雄才英略盛容猛氣矣又居至尊之位處兆人之上六軍環衛百司具存不惡而嚴矣不怒而威矣故常欲令守其雌靜如為天下之溪溪者沖虛容受藏疾納污之地也夫如是則其德常不離於身也復歸於嬰兒言其守道懷德其性還如嬰兒真常未散使矯僞之端不能入其心境也又雖知其明白皎潔要令常守拱默暗然之道乃可為天下法式夫如是則其德無有差忒復歸於中正之極也夫榮辱者相隨之物也人君能知其榮華倏忽而來常思困辱襲其後者則為天下谷谷與溪義同也以是道德常足復歸於朴朴者元氣之質也故聖人散朴則為器量用人則為官長大制者謂制天下國家也夫制天下者豈有細碎割截之事邪故曰大制不割將欲取天下章第二十九臣真述曰此一章道君特言非望之人將欲取天下而為之者吾已見其不得也為之者謂興動兵戎之事也故曰天下神器不可為不可為者言不可用干戈而取之也若以此為之者必敗也以此縱有暫執而得之者亦旋而失之也故物有行有隨有煦有吹有强有羸有載有隳者皆禍福之倚伏也是以聖人去甚去奢去泰將欲立於中道守之無怠戒之至也以道佐人主章第三十臣真述曰此一章特戒將相輔弼之臣也言以道佐人主不以兵强於天下其事好還者臣敢借秦事以言之李斯趙高白起蒙恬之類皆不以道佐其主而直以武力暴强吞噬攫搏焚詩書坑儒士血趙卒四十餘萬其於所下之處悉殘滅之使無遺種始皇猶獨鶚視天下未足其心雖天祿已終而毒螫之餘仍相殘害不經時而土崩魚爛矣是以胡亥弒於望夷子嬰戮於咸陽扶蘇死於長城李斯父子糜潰於雲陽白起齒劍於杜郵趙高取滅於宫闈此皆事之還也又師之所處荆棘生焉大軍之後必有凶年且興師十萬日費千金十萬之師在野則百萬之人流離於道路矣加以殺氣感害旱疫相乘災沴之深莫甚於此故善為將者當須果而已不敢以取强果而勿矜果而勿驕果而不得已是果而勿强不得已者是聖人用兵之要道也即是宜果行勿强之道不伐其功不樂殺人恬淡為上雖勝不美此是果而勿强之義也夫物壯則老師曲之謂也所謂早已者言不道之師早當止已而勿復進用向使李斯白起之師早圖退止豈有自焚之禍邪夫佳兵章第三十一臣真述曰兵者劍戟戈矛之類也佳好也言器械者唯修飾犀利珍好者適是不善之器也又左陽為吉右陰為凶君子必不得已而用之則當以恬淡為上恬是安靜淡無味也言戰陳雖勝當須淡而無味故曰不美美之者則為喜樂於殺人也且所殺者皆吾人也吾人也安得而樂殺之必也樂殺之則王者何以得志於天下也又古者殺人衆多以悲哀泣之戰勝以喪禮處之為所殺者皆吾人安得不以喪禮處之乎後代則不然師徒所征之處大抵成敗相半矣設有一勝必先以大帛顯書其事露布其文彼主將者仍皆以十作百以百為千以千為萬用要其功上之人或知其詐欺且借以為勢務立其威此則使人怨於顯明之中神怒於幽暗之處故曰不可以得志於天下矣如此為將豈得謂以道佐人主乎道常無名章第三十二臣真述曰朴者道之實以其精妙微細無所不在故曰小也言王侯若能守此微妙之道常能無為清靜則萬物自來賔服矣天地陰陽自然和合矣甘露時雨自然降潤矣如是則言不令人人自得其均平矣由此之故始復制致萬物之名物既有名則夫君臣上下萬物萬事無不各知其所止矣故為君者知止於仁為臣者知止於忠為子者知止於孝為朋友者知止於信為夫婦者知止於義為干戈者知止於戢為賦斂者知止於薄既各知其所止故皆得不至於危殆也譬如道在天下用之為治猶川谷之與江海言其感應走集晝夜朝宗無時休息也知人者智章第三十三臣真述曰夫測度淺深聽言觀行人焉廋哉此庶可以智知故曰知人者智至於澄心內照無我無人了然自知非明孰可故曰自知者亞聖之稱言人自知之難也夫嬴不及霸始僭稱皇項未及强而先稱霸然秦兼天下楚伏諸侯并吞則六國逡巡叱咤則三軍辟易夫如是適可謂有力而勝人者也夫有力而勝人者未嘗不終為人所勝若乃周家忠厚之德豈不謂自勝者歟且避狄愛人從之者如市觀兵誓衆暗會者如期是以前徒自攻一戎大定至其末裔凌遲諸侯力政猶不敢為主海內空位四五十年斯豈不謂自勝者歟故曰能成霸王者必得勝者也能得勝者必强者也能强者必能用人力者也能用人力者必得人心也能得人心者必自得者也能自得者必柔弱者也故强大者有道則不戰而克小弱者有道則不爭而得又知足之富貨財無數人之道也自强其志乾乾不息天之道也善守其道不失其所非久而何慎終如始則無敗事非壽而何大道泛兮章第三十四臣真述曰此言大道泛然盈滿天下可左可右者謂萬物無不從也無不在也萬物所以恃之而生育長茂亦所辭謝其恩功成而不名有者言聖人順道而理加以無心之愛被以無情之養故不為萬物之主自然常無所欲此豈可名之為小邪又萬物悉皆歸之而聖人以至公之道御之亦不曰我為萬物之主此豈得不謂之大邪是以聖人常不為大故能成其大明矣執大象章第三十五臣真述曰天垂象聖人則之言王者執持大象不失其道則天下之人無不歸往往者又皆以道德安之養之使其通泰無害則何異於置飲食宴樂於康衢之上而悅飽行過之人哉又以微妙之道治軍行師皆以恬淡無味為上自然無形無迹故使視聽者不可得而聞見也又大道之行愈多愈有無盡無窮故曰用之不可既既盡也已也將欲歙之章第三十六臣真述曰此一章正言其天地鬼神害盈福謙之義也言治國治軍者必須仰思天道俯察人事常宜深自警戒曰夫天時人事乃今固開張我者莫將欲歙斂我乎乃今固强大我者莫將欲弱小我乎乃今固興盛我者莫將欲廢黜我乎乃今固饒與我者莫將欲劫奪我乎王侯若能始終戒慎若此者可謂知微知彰矣故下文云柔弱勝剛强此亦非謂使柔弱之徒必能制勝剛强之敵直指言王侯者已處剛强之地宜存柔克之心耳故謙卑儉約即永享其年驕亢奢淫即自遺其咎蓋物理之恆也聖人猶恐不悟下文又切戒之曰魚不可脫於淵魚喻衆庶也淵喻道德也夫王者理人當須置之仁壽之域使魚在深水之中常無困涸網罟之患則獲其安樂矣又先王耀德不觀兵兵者國之利器也固不可以示見於人兵者戰而不用存而不廢之物唯當備守於內不可窮黜於外者也若示人於外終有敗績之辱豈不慎哉道常無為章第三十七臣真述曰夫常道者謂無名之始道常者謂有名之初故本初無字乃為一氣之宗亦既有名為萬物之始又道法自然天地陰陽皆自然和合無所云為故曰無為也至於四時運行百物成熟故曰無不為也又天之道利而不害是以王者當行天之道凡天下之害知之盡無為也天下之利知之即無不為也夫天下之害莫大於用兵天下之利莫大於戢兵言王侯但能守此自然之道則物無不自化者既而化成又有嗜欲將作者即當鎮以無名之朴無名之朴亦以不欲為根靜而歸根常而復命可謂復守真常之道也真常之道既復即萬物安得不從而正也故曰天下將自正經曰我靜而民自正又論語云子率以正孰敢不正其是之謂乎道德經論兵要義迷卷之二
