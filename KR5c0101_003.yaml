front:
  text: 道德經論兵要義述卷之三器七
  hash: sha256:9a837c99cc310fa87336af1f9fd09ac276a6858e10e5c40b89942f369d14d893
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0101_HFL_003-001a, image: hfl/0417/0417-070.png}
body:
  text: 朝議郎使持節漢州諸軍事守漢州刺史充威勝軍使賜緋魚袋臣王真上上德不德章第三十八臣真述曰上德者與道同體所謂三皇之時不可得而稱也故曰不德下德者為道之用所謂五帝之時親愛萌生故曰有德仁義禮者兼而行之所謂三王之初防患救亂之功興矣若總而論之將以理天下國家以及於身其揆一也故曰三皇五帝之與三王蓋殊事而同心異路而同歸者也是以道德仁義禮王者當兼而用之亦猶五材相資闕一不可也道君所以援古及今明其失得者蓋以其干羽寢於兩階金革興於三代忠信既薄玉帛空行優劣於下衰庶跂及於前古夫禮失則亂救亂者必以禮亂猶理也言禮者理亂之首也然道君之意蓋欲其時王捨禮而行義去義而成仁除仁而尚德違德而適道故曰大丈夫處其厚不處其薄居其實不居其華是以去彼禮義之薄取此道德之厚將以為王者之理化也豈不至哉故曰去彼取此昔之得一章第三十九臣真述曰夫唯道君廣引天地神谷及萬物之得一者觀其指歸皆在于戒侯王也以用也故若曰天地無用其清寧以自安泰當須常恐有裂發之變也神谷無用其靈盈以自恃當須常恐有歇竭之困也萬物無用其生成以自長久當須常恐有絶滅之時也侯王無用其貴高以自强大當須常恐有顛蹶之禍也故曰以賤為本也非乎夫不自强大則不爭不爭則兵戰自息兵戰自息則長保天祿矣反者道之動章第四十臣真述曰此言萬物動出藝藝無不反歸於根故曰反者道之動夫常物之動動之於動唯道之動動之於靜故曰反者道之動反猶復也復其見天地之心乎天地以靜為心以動為用今反其動是復其靜也故曰反者道之動也是以聖人慎其動而常處無為深達歸根守靜之義乃能知常能知常然後能不妄作能不妄作故為之明又柔弱者道之用言聖人必用柔弱之道以勝天下强暴之人也又物猶事也凡天下之事皆生於有有生於無是以聖人常處無為之事歸復於靜則萬物皆得自然生成不假云為動作故曰有生於無上士聞道章第四十一臣真述曰若聖與賢猶多品彙凡百庶士詎知等夷故道君於此略舉上中下三級以明識道之深淺爾文宣王曰朝聞道夕死可矣則上士勤行之志可得而知矣又以可上可下之性故有若存若亡之譏夏蟲疑冰之談故有聞道大笑之說故復建立其言有之曰明道若昧此言天之德也雖赫赫在上常如暗昧也進道若退此言地之德也雖蒸蒸在下常如卑退也夷道若纇此言人君之德也雖巍巍則天常同衆類不自標異夫如是故雖上德之君必如溪谷之卑下虛受納污也雖大潔白之君亦常如自居穢辱也雖廣大悉備常若不足也雖欲立德於人又須常畏人知故曰若偷也雖體道真實常若渝變也大方無隅寧見圭角大器晚成不求速達大音希聲必震蟄藏大象何形無狀之狀道本無名强為之名字作萬物母皆假借自然而生育之故曰善貸且成夫人君執德謙柔用晦無為之若此天下其孰能與之爭既無所爭則兵革自然戢藏也道生一章第四十二臣真迷曰夫元氣始生生生不已故有萬物盈乎天地之間又萬物之出莫不皆負背陰肅之氣抱向陽和之中中而和者乃得為人故謂之最靈既靈且智是能知損益之義乃稱號其所惡者蓋欲自取其損以冀其益爾故曰物有損之而益益之而損其是之謂歟言人之教戒亦當須取我此義以教戒之言若不知損益之道但恃衆好兵暴强輕敵必當摧辱破敗覆軍屠城即是失其死所明矣故曰强梁者不得其死夫治天下國家禍之大者莫過於此是以云吾將以為教父言教戒之重者亦莫過於此也天下之至柔章第四十三臣真述曰至柔者謙虛清靜所謂自然之氣也至堅者剛强運動所謂有為之徒也夫柔靜剛動弱必勝强故曰馳騁天下之至堅若人君能以精微密妙之道致無為之理則無所不入故曰無有入無間無為之事亦所謂清靜致理無為戎馬之事也不言之教欲其正身率下則人從之不待其言也故曰不從其所令從其所行也又經曰行不言之教是也然聖人之治無以加於是乎又道君歎其當代罕能行之故曰天下希及之名與身孰親章第四十四臣真述曰名者祿位也爭者忘其身貨者財寶也貪者輕其死夫名疏於身身多於貨雖甚愚者猶必知之及在得喪之間與奪之際則中智之徒盡未能免其惑也故唯聖人能知戰鬭之可息不爭其名知財貨之可足不害其身不多藏不厚亡是終厥身而辱殆所不能及故可以長久也大成若缺章第四十五臣真述曰夫聖人雖處萬全之地亦不矜其成常若虧缺故其用也終無弊敗之憂雖居至滿之勢亦不驕其盈常自謙虛故其用也永無窮困之厄又直於其人曲於其己故曰若屈藏其機微用其質朴故曰若拙際其文詞絶其給佞故曰若訥且此上文數節詳其大歸終本於清靜之德故引躁靜相形寒熱相用之義以證之夫清靜者無為也無為者亦謂無為於兵戰之事乃可為天下之長也又經曰我好靜而人自正又曰不欲以靜天下將自正皆此類也天下有道章第四十六臣真述曰夫去奔走之馬糞荆棘之田非有道歟四郊多壘戎馬生於其間非無道歟是以人君恣可欲於心則天下之人皆得罪矣嗜欲至而不知止足之分則天下之人皆受禍矣又人君所欲盡得則天下這人悉罹於殃咎矣必也上之人能知足之為足則天下之人孰不常足矣不出户知天下章第四十七臣真述曰夫人君則天效地恭己正南面無為於上垂拱而已無不為於下各有司存自然百度惟貞萬物咸若何必行而後知見而後名為而後成也為學日益章第四十八臣真述曰為學者謂傳習前王禮法政令滋章故曰日益也為道者謂善閉七門克持三寶故曰日損也夫天之道損有餘補不足故曰損之聖人之道損有餘奉天下故曰又損之能用此道自然以至於無為矣夫聖人少思寡欲偃武修文自然無所云為也又天下之利知無不為故曰而無不為也又聖人為君常無為無事以百姓心為心乃可以取天下之心也及其有事也則以賦稅奪人之貨財及其有為也則以干戈害人之性命夫如是則親離衆叛國滅人危又何可以取天下之心哉故曰不足以取天下聖人無常心章第四十九臣真述曰聖人以百姓心為心者蓋所謂以欲從人之義也人之不善吾亦善之者謂亦以道德教之使之為善故經曰人之不善何棄之有是也又人之不信吾亦信之者言我信不足使人不信亦以道德教之使之有信故曰德信又在猶察也聖人察天下常惵惵然不停不息而為渾同其心皆使去惡從善是以百姓悉傾注其耳目而視聽聖人之恩意而聖人咸子愛之故曰皆孩之既孩撫天下之人則為人之父母眀矣豈有人之父母肯以干戈刑罰而欲害其子乎必不然矣出生入死章第五十臣真述曰動出為生休入為死十有三者所謂四關之與九竅也夫四關者性命之源流九竅者嗜欲之門户源流則動靜存其節門户則啓閉有其時順之所以長生逆之所以致死又存生者莫過於養養過者復傷其生故曰夫何故以其生生之厚善攝生者謂聖賢也伏以道君謙不自言故曰蓋聞也夫聖人之道利而不害物豈能傷故雖之原陸亦不畋獵而求遇兕虎以殺之雖入軍中亦不被帶甲兵而求殺其敵是以終無角爪鋒刃之患者以其能和光同塵調養元氣存綿綿之道得生生之理故曰夫何故以其無死地又末世用兵置之死欲求不死其可得乎道生之章第五十一臣真述曰夫乾道無情而生坤德無情而畜是以物得流形勢得化成故萬物莫不尊道而貴德道尊德貴皆自然受天之爵祿也其孰能有封建者乎於是王侯則而象之言王者當宜生畜長育成熟養覆萬物而不失其時仍不有其功不恃其力絶其宰割息其鬬爭夫如是乃可謂合天之德也故曰玄德天下有始章第五十二臣真述曰道始有名乃為天下母王在域中故象其子既知其子復守其母言王者必當守道育物塞聰蔽明則永無勤苦危殆之事又能見其微細之萌而防杜之乃可曰明又能守其柔弱之道必終得其强大矣用其光言耀德於外歸其明謂體道于中治國治軍無害於物何殃之有故曰襲常襲猶密用也言王者常當密用斯道而已使我介然章第五十三臣真述曰我者我侯王也言侯王有能介然獨知行於大道唯所施為之事正當最可畏慎爾言其大道坦然甚平易而人不行但好趨其斜徑以求捷速之幸益欲速必不達故深戒之又言朝廷公署雖甚掃除修潔然而田野亦甚荒蕪倉廩亦甚空虛而戎臣武將不限有功無功皆被服羅紈橫帶刀劍屬厭飲食多藏貨賄專取不足之人奉有餘之室此誠所謂盜賊之矜誇豈可謂大道也哉此蓋道君深歎衰困之時天下若此之過故立此章以切戒之也善建不拔章第五十四臣真述曰善建者謂創業之主以德升聞故一立而不可拔也善抱者謂繼體之君以仁守位故一持而不可脫也此一章蓋明其全用修德行仁以傳萬祀之福都不在曆數時運干戈强力以取之也故經曰取天下常以無事及其有事不足以取天下又曰天道無親常與善人且自古天皇以降至于五帝子孫承繼其位者多至數萬年少亦數千歲暨于三代雖有辟王傷之猶得八九百年然後分崩離析以喪其國由是而言豈有曆數時運干戈强力者耶必不然矣又文王之詩曰刑于寡妻至于兄弟以御于家邦又曰文王孫子本支百世故經曰吾何以知天下之然哉以此豈不謂然乎含德之厚章第五十五臣真述曰此言德厚之君必精全氣和有如赤子之狀無機無慮自誠而明是以物莫能害夫毒蟲猛獸攫鳥者喻凶惡賊害之人言凶惡之徒雖有猛鋭毒之氣終亦不能傷於德厚之君也又引號而不嗄和之至者夫五常畢備謂之和故曰知和曰常知常曰明又生生滋益乃謂之祥言君人者當宜日自損戒其身心必令柔弱慈哀不能使氣任力故為强梁傳曰一鼓作氣再而衰三而竭明其使氣者不可久也又强者為壯壯者則老師老為曲義亦在兹故戒之早止令勿復行也知者不言章第五十六臣真述曰夫以道用兵則知者必不言其機也言者必不知其要也故曰知者不言言者不知塞其兊閉其門者兵之深機也挫鋭解紛和光同塵者兵之至要也并不可得而言也是以謂之玄同故聖人之師以戰則勝以守則固非天下之所敵也然而不敢輕天下之敵是以遠近者不可得而親疏惠怨者不可得而利害等夷者不可得而貴賤故為天下之所貴重也以政治國章第五十七臣真述曰治國者以政政者正也君率以正孰敢不正用兵者以奇奇者權也權與道合庸何傷乎以無事取天下無事者無兵革之事故曰吾何以知其然以此又曰天下多忌諱者以其漁獵竭澤禁止多門財不足於人利不流於下下之彌貧固其宜矣又使天下之人皆得肆其權謀操其利器非昏而何昏猶亂也民多伎巧奇物滋起必蕩上心也法令滋彰盜賊多有人不畏死也是以聖人云我無為而人自化言無為兵戰之事則人安而從化也我無事而人自富言無賦役之事則人理而日富也我好靜而人自正言歸根復命而人自正也我無欲而民自朴言不為嗜欲所遷則自朴矣其政悶悶章第五十八臣真述曰夫為君之道必當隱其聰明寬其教命常悶悶然則民自朴素矣若上有苛察之心則其下之人必欺違苟免不誠不信矣又福倚禍中禍藏福內唯人所召因事而生往來勝負之場追隨寵辱之際將迎或異休戚必同自身及家自家及國以至于天下無大無小所宜畏慎唯此倚伏爾又凡人之情但欣福來罕憂禍至且處禍之時萬慮思福居福之地一不防禍故曰孰知其極矧乃以正為邪以善為妖故曰人之迷其日固久是以聖人自居其方亦不裁割於人自守其廉亦不穢鄙其俗屈己伸人故曰直而不肆藏明用晦故曰光而不耀治民事天章第五十九臣真述曰嗇猶愛也言王者治人事天必當以仁愛為宗故曰莫若嗇夫仁愛之道行焉則天下早服天下早服故謂之重積德重積德者以戰則勝以守則固故曰無不克無不克則莫知其極莫知其極可以有國有國之母可以長久母謂道也謂王者守國有道自然根蒂深固以享長生久視之福也道德經論兵要義述卷之三
