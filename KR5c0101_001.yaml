front:
  text: 道德經論兵要義述卷之一
  hash: sha256:0cf16cc3014eeca76656de06487f2f9e6dda625f12520e069a195af1870032ad
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0101_HFL_001-001a, image: hfl/0417/0417-016.png}
body:
  text: 朝議郎使持節漢州諸軍事守漢州刺史充威勝軍使賜緋魚袋臣王真上道可道章第一臣真述曰夫稟二氣而生居三才之際靈於萬物者謂之最靈靈於最靈者謂之聖人聖人代天地而理萬物者也於是因言以立道因道以制名然異於真常之元故曰可道既為萬物之母故曰可名又天地之道無迹可尋故曰常無欲以觀其妙聖人之作有物有物可睹故曰常有欲以觀其徼觀猶示也且乾坤之用因無入有是以同出異名變化之理因有歸無是以同謂之玄蓋天地之道四時行焉百物生焉是為一玄也聖人之道代天理物各正性命復為一玄也故曰玄之又玄是以道君將明王者治天下安萬國正師旅孰不由於此户者也故曰衆妙之門臣伏惟玄元皇帝所建五千之文將垂億兆之祀同天地之覆載比日月之照臨利將無窮人受其賜故王者得之可以適天下諸侯得之可以安萬邦卿大夫得之可以凝庶績士庶人得之可以知其所歸若好徑之徒不遵此道必有倒行之悔矧其違易即險而欲僥幸者哉微乎微至乎至不可得而言也已是以初標道非常道指其殊塗而同歸末言衆妙之門明其百慮而一致冠於篇首誠有旨哉天下皆知章第二臣真述曰夫美者對惡之謂也今天下之人皆知美之為美者此已知其惡也久矣皆知善之為善者此己知其不善也久矣故其下文云有無之相生難易之相成長短之相形高下之相傾音聲之相和前後之相隨夫物既有名人既有情則是非彼我存乎其間是非彼我存乎其間則愛惡起而相攻矣愛惡起而相攻則戰爭興矣夫戰爭者不必皆用干戈斧鉞也至於匹夫之相手足蟲獸之相爪牙禽鳥之相觜距皆爭斗之徒也然至於王侯之動即無不用其金革矣為患之大莫甚於斯故偃武修文興利除害其事既理故曰無為其教既行故曰不言是以云聖人處無為之事行不言之教也夫無為之事蓋欲令潛運其功陰施其德使百姓日用而不知之此之謂無為也夫不言之教蓋欲令正身率下而不欲使躬之不逮也古者言之不出同此義也夫王者無為於喜怒則刑賞不濫金革不超無為於求取則賦斂不厚供奉不繁無為於愛惡則用捨必當賢不肖别矣無為於近侍則左右前後皆正人矣無為於土地則兵革不出士卒不勞矣無為於百姓則天下安矣其無為之美利信如是哉又萬物作焉而不辭者言上下皆得自然之分悉無言辭也又生而不有其恩為而不恃其德獨立造化而不居其功不怙其強卑以自守所以事業簡易而長不離其身故曰夫唯不居是以不去不尚賢章第三臣真述曰夫聖人之理不伐其善不顯其長上行其風下承其化既絶矜尚遂無鬭爭非謂其不用賢能而使人不爭也且自三皇五帝至于王霸未有不上尊三事下敬百寮外資卿相之弼諧內有后妃之輔助此奚謂其不尚賢乎哉必不然也又難得之貨皆是遠方異物若在上貴之無饜則在下之人供輸無已更相求取非盜而何盜賊既興兵革斯起矣又珍物麗容是人之所欲而聖人達理不蕩於胸中故其心不可得而亂也是以聖人虛其心者除垢止念也實其腹者懷忠抱信也弱其志者謙柔不犯於外也強其骨者堅固有備於內也常使人無知無欲者蓋率身以正人故使夫智者亦不敢為也故此下文云為無為者直是戒其人君無為兵戰之事也語曰舜何為哉恭己正南面而已若人君皆能如舜之德則天下安得不治矣故曰為無為則無不治矣道沖而用章第四臣真述曰此章言人君體道用心無有滿溢之志長使淵然澄靜如萬物之祖宗則自然挫折鋒鋩之銛鋭解釋紛擾之云為故能和其光耀降嚴威也同其塵雜舍垢氛也然玄元深歎此有道之君能存其至德如是故云吾不知其誰之子象帝之先言似天帝之先也天地不仁章第五臣真述曰此言不仁者猶下經云不德也言天道與王者同施仁恩能以美利利天下不言所利且不責生成之報焉王者既不責於人則刑罰自然不用矣刑罰不用則兵革自然不興矣兵革不興則天下自然無事矣故曰天地之間其猶橐籥乎言國君能調和元氣應理萬機如橐籥之用焉終無屈撓之弊也又夫人不言言必有中是以聖人處無為之事行不言之教故曰多言數窮不如守中其此之謂乎谷神不死章第六臣真述曰谷養也又虛空也言神氣遊息於虛空之中故得長存也玄天為鼻牝地為口天根於清地根於寧此言人君長能固守清寧之道以理其天下國家則自然無動用勤勞之事故曰用之不勤天長地久章第七臣真述曰夫天清而運動不已地寧而安靜無窮皆以其順自然之化無獨見之專不矜其功不厚其生施陽布陰復不為主故能長生也是以聖人能則象天地之德清寧沖虛不敢為天下先故能長先矣又外其身者謂不矜貴其身則憂患不能及所以得其身長存也又經曰及吾無身吾有何患非此之謂歟若夫人君克己復禮使天下歸仁既得億兆歡心蠻夷稽顙自然干戈止息宗廟安寧故曰非以其無私邪故能成其私上善若水章第八臣真述曰此一章特諭理兵之要深至矣夫上善之兵方之於水然水之溢也有昏墊之災兵之亂也有塗炭之害故水治則潤澤萬物通濟舟楫兵理則鎮安兆庶保衛邦家若理兵能象水之不爭又能居所惡之地不侵害者則近於道矣是以兵之動息必當擇利而處之故曰居善地也主將之心必在清澄深淨故曰心善淵也兵者類多凶害故戒之曰與善仁也夫軍旅之政失則為亂故曰政善治也兵者所尚謀慮精微故曰事善能也凡興兵整衆應敵救災必當其期故曰動善時也既上文具標七善不爭之德矣此又重云夫惟不爭故無尤者臣伏以道君之意深切誨諭者正欲勸其人君無為於上不爭於下爾夫無為者戢兵之源不爭者息戰之本若王侯能明鑒其源洞觀其本簡其云為息其爭鬭則金革寧矣臣又竊嘗習讀五千之文每至探索奧旨詳研大歸未嘗不先於無為次於不爭以為教父凡人之情不能無爭唯聖人乃能無爭又爭之徒衆矣令臣略舉梗概皆起於無思慮無禮法不畏懼不容忍故亂逆必爭剛強必爭暴慢必爭忿至必爭奢泰必爭矜伐必爭勝尚必爭違復必爭進取必爭勇猛必爭愛惡必爭專恣必爭寵嬖必爭夫如是王者有一于此則師興於海內諸侯有一于此則兵交於其國卿大夫有一於此則賊亂於其家士庶人有一于此則害成於其身是以王者知能官人能安人之道必當先除其病俾之無爭則戰可息矣戰可息矣則兵自戢矣是故其要在於不爭且夫爭城殺人盈城爭地殺人滿野語曰君子無所爭又曰在醜不爭爭則兵矧乎王者豈固有爭乎哉故下經末章云天之道利而不害聖人之道為而不爭此所謂知終終之之義也持而盈之章第九臣真述曰夫兵者人清之所恃賴也且匹夫之徒帶三尺利劍持數寸匕首至有憑凌天子劫脅諸侯或邀盟於前或請命於後往往而得矧乎當九五之位全億兆之師尊居一人下臨萬物乃知持盈不易揣鋭實難故曰金玉滿堂莫之能守富貴而驕自遺其咎此道君又以時人最所重者金玉故指以為戒冀其能保借之用存兢惕之意也此又特戒其王侯令守彼謙沖去兹奢泰永言伊戚無至自貽故下文又云功成名遂身退天之道也此言身退者非謂必使其避位而去也但欲其功成而不有之耳故經云夫唯不居是以不去其此之謂乎營魄抱一章第十臣真述曰魄者陰之質也一者陽之精也此言人君常當抱守一氣專致柔和使如嬰兒之德善也滌除玄覽欲其洗心內照志無瑕穢也愛人治國能無為者夫欲治其國先愛其人欲愛其人先當無為無為者即是無為兵戰之事兵戰之事為害之深欲愛其人先去其害故曰無為兵戰之事也天門者鼻息之謂也欲其綿綿雖靜常令呼吸進退得其自然也明白者視聽之謂也欲其周流四達而常若無知也自此以上皆言理身理國兼愛之道也生之畜之生而不有為而不恃長而不宰是謂玄德此以上聖人順天之道以養萬物故不居其功乃云此天之德也玄天也三十輻共一轂章第十一臣真述曰此車器及室三者皆取其因無而利有因有而用無故引之以為證何者夫五兵之屬亦當其無有兵之用且弧矢之利以威天下不必傷人然後為用故知兵者備之以為有戢之以為無此即用其所不用者也蓋無之以為用亦明矣五色令人章第十二臣真述曰五色所以養目也視過則盲五音所以養耳也聽過則聾五味所以養口也食過則爽故聖王之理常復衆人之所過以全其身以安其神夫人君之心以睿智為本清靜為根若乃逐獸荒原奔車絶巘六龍逸足萬騎莫追與雕鶚而爭先并熊羆而賈勇日月虧蔽旌旗糾紛馳騁忘歸殺獲無補風雨恆若宫室或空謂之發狂蓋由此矣故經曰奈何萬乘之主而以身輕天下其是之謂乎又人君所貴難得之貨則盜賊生盜賊生則兵由此起兵由此起害莫大焉令人行妨固其宜矣是以聖人為腹者貴其容受而無情也不為目者賤其觸見而有欲焉故曰去彼取此寵辱若驚章第十三臣真述曰夫王者守位皆承天之寵也諸侯得國皆承王之寵也故因寵所以為貴因貴所以生驕因驕所以獲罪因罪所以蒙辱是以聖人之得失常若驚也又王侯在上若不能以貴下賤自卑尊人但好戰恃兵乘勝輕敵必即禍患及之矣故以有其身乃為身患外其身乃為身存豈不至哉是以貴其身者適可以暫寄於天下愛其身者可以永託於天下也故經曰聖人自知不自見自愛不自貴其是之謂乎視之不見章第十四臣真述曰夷者平易之稱所謂天之道故可視而不可見也希者依違之稱所謂地之道故可聽而不可聞也微者精妙之稱所謂人之道故可摶而不可得也然天雖清光運行終不為皎潔以自顯也地雖寧靜博厚亦不為暗昧以自幽也人雖生生無窮終不為分别以自尊也故曰其上不皎其下不昧繩繩兮不可名也是以散而陳之則為三才合而渾之則為一德故曰復歸於無物是謂無狀之狀無物之象是謂惚恍此以上又言萬物因無入有從有歸無惚有恍無故云忽恍也又迎之不見其首隨之不見其後此言自三而復一無始無終從一成三無終無始故使人君執此上古無為之道以治當今有名之物也無為者亦謂無兵戰之事也有名者謂軍國之務也故能知始朴素之義乃可為道之綱紀也古之善為士章第十五臣真述曰此古之善為士者謂上士也所謂若聖與賢而在王侯之位者也微妙玄通者皆道德之用不可得而稱也言聖人賢人治天下軍國無不兢懼畏威皆若臨深履薄其容貌志意故常若冬寒涉川畏耻四鄰言慎之至也儼兮若客者經曰用兵有言吾不敢為主而為客不敢進寸而退尺是也涣若冰之將釋言合散屈伸嘗無結滯也敦朴者質素之謂曠谷者深邃之謂夫濁久徐清安久徐生皆順自然之理動靜不失其時言孰能如此唯聖賢耳故曰保此道不欲盈言若王侯守此道者不欲滿溢而驕盈也故曰夫唯不盈故能弊不新成此言能守道因循終無矜耀乃得長如弊故不立新成之迹也致虛極章第十六臣真述曰夫天之道常清虛太極無私於覆燾地之道常沉靜博厚無私於亭毒則是陰陽各得其恆故人與萬物俱得盡其生成之理故曰萬物並作復者其見天地之心故曰吾觀其復夫物藝藝者生生之謂也生生之理盡故各復歸其根本以守其靜是則歸根曰靜靜曰復命復命曰常言萬物盡無大傷各得復其性命以足自然之分即可謂得真常之道也故聖人能知此真常之道則是明白四達無所疑惑也若人君不能知此真常之道而乃縱其嗜欲妄作不祥興動干戈流行毒螫則必有凶災之報故曰妄作凶又知常容者言王侯若能容人畜衆則可謂至公無私至公無私即王道自著王道自著則其德象天德象天乃可與之適道既可適道自然能長且久故得終竟千齡必無危殆之患也太上下知章第十七臣真述曰太古大道之行上德不德是以其下之人但知其在上有君而已蓋日用而不知是也至於中古仁德兼施恩惠日及是以愛而親之美而譽之其事漸著其次以義為治小罪用刑罰大罪興甲兵是以畏之其下以禮為治禮煩則亂誠喪欺生是以侮之又信不由衷人不信矣飾詞相詐猶或貴言悲夫是以王者當宜成不居之功守不敗之事使百姓不知帝力皆謂我自然而然善也道德經論兵要義述卷之一
